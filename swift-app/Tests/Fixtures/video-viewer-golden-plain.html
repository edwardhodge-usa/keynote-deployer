<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Keynote Slide Viewer</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#0a0a0a; color:#e5e5e5; font-family:-apple-system,BlinkMacSystemFont,system-ui,sans-serif; min-height:100vh; display:flex; flex-direction:column; align-items:center; }
  header { width:100%; background:#111; border-bottom:1px solid #222; padding:14px 24px; text-align:center; } header h1 { font-size:16px; font-weight:600; }
  #deckContainer { display:none; width:100%; max-width:1024px; margin:24px auto 0; padding:0 16px; }
  #deck { position:relative; width:100%; aspect-ratio:1024/768; background:#111; border:1px solid #222; border-radius:8px; overflow:hidden; }
  #deck video { position:absolute; inset:0; width:100%; height:100%; object-fit:contain; display:block; background:#0a0a0a; }
  /* Edge tap-zones: tap the left/right of the slide to go back/forward — the
     natural gesture on phone/iPad. Invisible until pressed (faint chevron), so
     they never obscure slide content; buttons/dots/keyboard still work. */
  .navzone { position:absolute; top:0; bottom:0; width:30%; z-index:10; cursor:pointer;
    display:flex; align-items:center; -webkit-tap-highlight-color:transparent; user-select:none; }
  .navzone.left { left:0; justify-content:flex-start; padding-left:10px; }
  .navzone.right { right:0; justify-content:flex-end; padding-right:10px; }
  .navzone svg { width:28px; height:28px; opacity:0; transition:opacity .15s;
    filter:drop-shadow(0 1px 3px rgba(0,0,0,.7)); }
  .navzone:hover svg, .navzone:active svg { opacity:.6; }
  .navzone.off { cursor:default; pointer-events:none; }
  .navzone.off svg { opacity:0 !important; }
  #viewer { display:none; width:100%; max-width:1024px; margin:16px auto 0; padding:0 16px 32px; flex-direction:column; align-items:center; gap:12px; }
  .controls-row { display:flex; align-items:center; gap:16px; }
  #slideCounter { font-size:13px; color:#999; min-width:80px; text-align:center; }
  #dotStrip { display:flex; align-items:center; justify-content:center; flex-wrap:wrap; gap:0; max-width:100%; padding:4px 0; }
  .dot { width:8px; height:8px; border-radius:50%; background:#333; border:none; padding:0; margin:0 2px; cursor:pointer; min-width:8px; transition:background .1s; } .dot.active{background:#3b82f6;} .dot:hover{background:#555;}
  button { padding:8px 16px; background:#222; border:1px solid #333; border-radius:6px; color:#ccc; font-size:13px; cursor:pointer; } button:hover{background:#333;} button:disabled{opacity:.3;cursor:default;}
  .keyboard-hint { font-size:11px; color:#555; }
  /* Always reserve the spinner's slot (visibility, not display) so toggling busy
     never reflows / shifts the Prev/Next buttons. */
  #spinner { width:14px; height:14px; border:2px solid #333; border-top-color:#3b82f6; border-radius:50%; flex:0 0 auto; visibility:hidden; }
  body.busy #spinner { visibility:visible; animation:kd-spin .7s linear infinite; }
  @keyframes kd-spin { to { transform:rotate(360deg); } }
  body.in-iframe #spinner { width:clamp(14px,1.5vw,20px); height:clamp(14px,1.5vw,20px); }
  #loading { display:flex; position:fixed; inset:0; background:rgba(10,10,10,.92); z-index:100; flex-direction:column; align-items:center; justify-content:center; gap:16px; } #loadingText{font-size:14px;color:#999;}
  #loadSpinner { width:40px; height:40px; border:3px solid rgba(255,255,255,.12); border-top-color:#3b82f6; border-radius:50%; animation:kd-spin .8s linear infinite; }
  body.viewer-ready #deckContainer { display:block; }
  @media all {
    body.in-iframe header, body.in-iframe .keyboard-hint, body.in-iframe .powered-by { display:none !important; }
    body.in-iframe { height:100vh; overflow:hidden; justify-content:safe center; gap:14px; padding:12px 0; background:transparent; }
    body.in-iframe.viewer-ready #deckContainer { display:flex; align-items:center; justify-content:center; flex:1 1 auto; min-height:0; max-width:none; width:100%; margin:0; padding:0 16px; }
    body.in-iframe #deck { width:auto; height:100%; max-width:100%; aspect-ratio:1024/768; background:transparent; border:none; border-radius:0; }
    body.in-iframe #deck video { background:transparent; }
    body.in-iframe #viewer { flex:0 0 auto; max-width:none; width:100%; margin:0; padding:0 16px; }
    body.in-iframe .controls-row { gap:clamp(16px,1.8vw,28px); }
    body.in-iframe .controls-row button { font-size:clamp(13px,1.4vw,17px); padding:clamp(8px,.9vw,12px) clamp(16px,1.8vw,24px); border-radius:clamp(6px,.6vw,9px); }
    body.in-iframe #slideCounter { font-size:clamp(13px,1.4vw,17px); min-width:clamp(80px,8vw,110px); }
    body.in-iframe .dot { width:clamp(8px,.9vw,11px); height:clamp(8px,.9vw,11px); min-width:clamp(8px,.9vw,11px); margin:0 clamp(2px,.25vw,4px); }
    body.in-iframe #dotStrip { row-gap:6px; }
    body.in-iframe #loading { background:transparent; } body.in-iframe #loadingText { background:rgba(10,10,10,.82); padding:8px 16px; border-radius:8px; backdrop-filter:blur(4px); }
  }
  /* Narrow embeds (phones): the dots wrap into rows and waste height + are too
     small to tap — drop them, keep Prev/Next + the "X of N" counter. */
  @media (max-width:549px){ #dotStrip { display:none !important; } }
  
</style></head>
<body>
  <header><h1>Keynote Slide Viewer</h1></header>
  <div id="deckContainer"><div id="deck"><video id="vid" muted playsinline preload="auto"></video><div class="navzone left" id="navPrev" aria-label="Previous slide"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></div><div class="navzone right" id="navNext" aria-label="Next slide"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></div></div></div>
  <div id="viewer">
    <div class="controls-row"><button id="prevBtn" disabled>&#9664; Previous</button><span id="slideCounter">Slide 0 / 0</span><button id="nextBtn" disabled>Next &#9654;</button><span id="spinner" aria-hidden="true"></span></div>
    <div id="dotStrip"></div>
  </div>
  <div id="loading"><div id="loadSpinner"></div><div id="loadingText">Loading presentation…</div></div>
  <script>if (window.self !== window.top) document.body.classList.add('in-iframe');</script>
  <script>
    var TS = [0,2.5,7];
    var N = TS.length, VW=1024, VH=768, EPS=0.03;
    // Bias the rest frame ~2 frames off the matched keyframe into the stable hold.
    // (Exact per-slide rest placement is imperfect from auto-derivation — that's what
    // the marker editor is for. The transition smoothness is handled by a bounded GOP
    // in the encoder, not by this bias.)
    var REST_BIAS = 0;
    function restTime(i){ var t = TS[i] - REST_BIAS; return t > 0 ? t : 0; }
    var vid = document.getElementById('vid'), deckContainer = document.getElementById('deckContainer'), loading = document.getElementById('loading');
    // playing = a transition is animating; navBusy = ANY nav in progress incl. the
    // paintFrame micro-play tail. navBusy is the re-entrancy lock: no nav may start
    // until the previous one (and its paint) fully completes, so a fast re-tap can't
    // race the paint's pending pause into the next transition (freeze-halfway bug).
    var current = 0, playing = false, navBusy = false, paintTimer = null;
    

    // Rest = the PAUSED video frame, biased a touch before this slide's keyframe.
    function settleOn(i){
      navBusy = true; current = i; playing = false;
      try { vid.pause(); vid.currentTime = restTime(i); } catch(e){}
      updateControls();
      paintFrame(function(){ navBusy = false; setBusy(false); updateControls(); reportHeight(); });
    }
    // iOS won't paint a seeked frame on a PAUSED video until it plays, so Prev /
    // dot-jumps changed state but left the previous frame on screen. A ~40ms micro
    // play->pause forces the current frame to render; restTime sits mid-hold so
    // there's no visible motion. The initial load has no user gesture (play() is
    // blocked there) — the <video poster> covers that first paint instead. The timer
    // is cancelable and fires `doneCb` exactly once so callers can release navBusy
    // only after the paint settles.
    function paintFrame(doneCb){
      if (paintTimer){ clearTimeout(paintTimer); paintTimer = null; }
      var settled = false;
      var done = function(){ if (settled) return; settled = true; paintTimer = null; try { vid.pause(); } catch(e){} if (doneCb) doneCb(); };
      try {
        var p = vid.play();
        if (p && p.then) { p.then(function(){ paintTimer = setTimeout(done, 40); }).catch(function(){ done(); }); }
        else { paintTimer = setTimeout(done, 40); }
      } catch(e){ done(); }
    }
    function updateControls(){
      var atStart = current<=0 || playing || navBusy, atEnd = current>=N-1 || playing || navBusy;
      document.getElementById('prevBtn').disabled = atStart;
      document.getElementById('nextBtn').disabled = atEnd;
      var zp = document.getElementById('navPrev'); if (zp) zp.classList.toggle('off', atStart);
      var zn = document.getElementById('navNext'); if (zn) zn.classList.toggle('off', atEnd);
      document.getElementById('slideCounter').textContent = (current+1)+' of '+N;
      var dots = document.querySelectorAll('.dot');
      for (var k=0;k<dots.length;k++) dots[k].classList.toggle('active', k===current);
    }
    // Next: play the real transition to the next slide, then pause on its keyframe.
    function next(){
      if (navBusy || playing || current>=N-1) return;
      navBusy = true; playing = true; setBusy(true); updateControls();
      var target = restTime(current+1);
      function go(){
        // iOS WebKit returns vid.currentTime=0 during inline playback inside a
        // cross-origin iframe (the Framer embed), so the old "play then poll
        // vid.currentTime" never reaches the boundary and the deck free-plays
        // through every slide. Stop instead off clocks that DO advance during
        // playback: a setInterval wall-clock (timers tick reliably on iOS) as the
        // primary, plus requestVideoFrameCallback mediaTime as a precise early-stop
        // where it's honored (desktop). Neither reads vid.currentTime. After
        // stopping we seek to the exact rest frame, so the paused frame is correct
        // regardless of stop precision. (rAF + timeupdate were both verified dead
        // ends on iOS in this embed: rAF fires but reads currentTime=0; timeupdate
        // barely fires; rVFC.mediaTime is unreliable too — wall-clock is the anchor.)
        var done = false, startPos = restTime(current), rate = vid.playbackRate || 1, capTimer = null, safety = null;
        // Budget = how long the transition should take, + a small margin. Count only
        // ACTUAL playing time toward it: on the FIRST visit to a slide the region isn't
        // buffered yet, so playback stalls ('waiting') mid-transition. A clock anchored
        // to real time would keep elapsing through the stall and fire finish() before
        // the transition renders → it stutters then SKIPS to the rest frame. Pausing
        // the clock on 'waiting'/'stalled' and resuming on 'playing' makes the budget
        // track real playback, so the transition ALWAYS completes (and a buffered
        // replay is smooth — which is exactly why go-back-and-retry already worked).
        var budgetMs = Math.max(200, (target - startPos) * 1000 / rate) + 120;
        var accum = 0, lastResume = 0, running = false;
        function clockResume(){ if (!running){ running = true; lastResume = Date.now(); } }
        function clockPause(){ if (running){ accum += Date.now() - lastResume; running = false; } }
        function elapsed(){ return accum + (running ? Date.now() - lastResume : 0); }
        function cleanup(){
          vid.removeEventListener('playing', clockResume);
          vid.removeEventListener('waiting', clockPause);
          vid.removeEventListener('stalled', clockPause);
        }
        function finish(){
          if (done) return; done = true;
          if (capTimer){ clearInterval(capTimer); capTimer = null; }
          if (safety){ clearTimeout(safety); safety = null; }
          cleanup();
          vid.pause(); current++; playing = false;
          try { vid.currentTime = restTime(current); } catch(e){}
          updateControls(); reportHeight();   // new slide number; controls stay disabled (navBusy still true)
          // Force iOS to repaint the settled rest frame, and hold navBusy until that
          // 40ms paint settles so a fast re-tap can't race it into the next transition.
          paintFrame(function(){ navBusy = false; setBusy(false); updateControls(); });
        }
        function vf(now, meta){
          if (done || !playing) return;
          clockResume();   // rVFC firing == frames are presenting == playing
          var mt = (meta && meta.mediaTime != null) ? meta.mediaTime : 0;
          if (mt >= target - EPS){ finish(); return; }
          if (vid.requestVideoFrameCallback) vid.requestVideoFrameCallback(vf);
        }
        vid.addEventListener('playing', clockResume);
        vid.addEventListener('waiting', clockPause);
        vid.addEventListener('stalled', clockPause);
        capTimer = setInterval(function(){
          if (done || !playing){ if (capTimer){ clearInterval(capTimer); capTimer = null; } return; }
          if (vid.ended || elapsed() >= budgetMs) finish();
        }, 50);
        // Hard safety: even counting only playing time, never hang nav (true stall).
        safety = setTimeout(function(){ if (!done) finish(); }, budgetMs + 8000);
        var pp = vid.play(); if (pp && pp.catch) pp.catch(function(){});
        if (vid.requestVideoFrameCallback) vid.requestVideoFrameCallback(vf);
      }
      // Don't start the transition until any in-progress seek settles AND we're
      // parked at this slide's frame — otherwise play() races the seek and freezes.
      if (vid.seeking || Math.abs(vid.currentTime - restTime(current)) > 0.1){
        var proceeded = false;
        var proceed = function(){ if (proceeded) return; proceeded = true; vid.removeEventListener('seeked', proceed); go(); };
        vid.addEventListener('seeked', proceed);
        try { vid.currentTime = restTime(current); } catch(e){ proceed(); }
        // iOS may not fire 'seeked' for a seek on a paused video → don't hang waiting.
        setTimeout(proceed, 250);
      } else { go(); }
    }
    function prev(){ if (navBusy || playing || current<=0) return; settleOn(current-1); }
    function jump(i){ if (navBusy || playing) return; settleOn(i); }

    function reportHeight(){
      if (window.self===window.top) return;
      var avail = document.documentElement.clientWidth - 32, dw=Math.min(avail,VW), dh=dw*(VH/VW);
      var v=document.getElementById('viewer'); var ch=v?v.offsetHeight:80;
      window.parent.postMessage({ type:'kd-viewer-height', height: Math.ceil(dh+ch+14+24+8) }, '*');
    }
    var rt=null; function sched(){ if(rt)clearTimeout(rt); rt=setTimeout(reportHeight,80); }
    window.addEventListener('resize', sched);
    if (window.ResizeObserver){ try{ new ResizeObserver(sched).observe(document.documentElement);}catch(e){} }

    var dotStrip = document.getElementById('dotStrip');
    for (var i=0;i<N;i++){ (function(idx){ var d=document.createElement('button'); d.className='dot'; d.title='Slide '+(idx+1); d.onclick=function(){ jump(idx); }; dotStrip.appendChild(d); })(i); }
    document.getElementById('nextBtn').onclick = next;
    document.getElementById('prevBtn').onclick = prev;
    document.getElementById('navNext').onclick = next;
    document.getElementById('navPrev').onclick = prev;
    document.addEventListener('keydown', function(e){ if(e.key==='ArrowRight')next(); if(e.key==='ArrowLeft')prev(); });

    // Busy spinner (controls row only) — toggled EXPLICITLY from next()/finish()/
    // settleOn(). It is deliberately NOT driven by 'seeking'/'seeked': iOS never
    // fires 'seeked' for a seek on a paused video, which left the spinner stuck
    // spinning forever once the viewer came to rest.
    function setBusy(b){ document.body.classList.toggle('busy', b); }

    function startUp(){
      loading.style.display='none'; document.getElementById('viewer').style.display='flex'; document.body.classList.add('viewer-ready');
      if (document.body.classList.contains('in-iframe')) deckContainer.style.maxWidth = VW+'px';
      settleOn(0); setTimeout(reportHeight,250); setTimeout(reportHeight,700);
    }
    // Download the WHOLE deck up front (into an in-memory blob) and play from that,
    // so the FIRST visit to any slide is as smooth as a buffered replay — there is no
    // mid-playback network fetch left to stall a transition (the cause of the
    // first-pass stutter/skip; replays were already smooth because the bytes were
    // cached). Falls back to normal streaming if the fetch fails.
    (function loadDeck(){
      var url = "./slides.mp4", lt = document.getElementById('loadingText');
      var stream = function(){ if (!vid.src) vid.src = url; };
      try {
        var xhr = new XMLHttpRequest();
        xhr.open('GET', url, true); xhr.responseType = 'blob';
        xhr.onprogress = function(e){ if (e.lengthComputable && lt) lt.textContent = 'Loading presentation… ' + Math.round(e.loaded / e.total * 100) + '%'; };
        xhr.onload = function(){
          if (xhr.status >= 200 && xhr.status < 300 && xhr.response){
            try { vid.src = URL.createObjectURL(xhr.response); } catch(e){ stream(); }
          } else { stream(); }
        };
        xhr.onerror = stream; xhr.onabort = stream;
        xhr.send();
      } catch(e){ stream(); }
    })();
    if (vid.readyState >= 1) startUp(); else vid.addEventListener('loadedmetadata', startUp, { once:true });
    vid.addEventListener('error', function(){ document.getElementById('loadingText').textContent='Video failed to load.'; });
  </script>
</body></html>
